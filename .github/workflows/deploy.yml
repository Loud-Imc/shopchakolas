name: Deploy to DigitalOcean

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /var/www/chakolas-ecom
            git pull origin main
            
            # Update Backend
            cd backend
            npm install
            npx prisma generate
            npm run build
            pm2 restart chakolas-backend
            
            # Update Storefront
            cd ../storefront
            npm install
            npm run build
            pm2 restart chakolas-storefront
            
            # Update Admin
            cd ../admin
            npm install
            npm run build
            pm2 restart chakolas-admin
